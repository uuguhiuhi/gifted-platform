<div class="layout"><aside class="side" id="side"><div class="logo"><div class="mark">✦</div><h1>منصة لجان التوجيه الطلابي</h1><p>إدارة لجان التوجيه الطلابي ومحاضر الاجتماعات</p><p id="schoolSide">مجمع عدي بن حاتم الطائي بعذفاء</p></div><nav class="nav">

<main class="main"><header class="top"><div style="display:flex;gap:9px;align-items:center"><button class="btn mobile" id="menu">☰</button><div><h2 id="title">الرئيسية</h2><small id="date"></small></div></div><div class="actions"><button class="btn no-print" id="backupTop">نسخة احتياطية</button><button class="btn primary" onclick="window.print()">طباعة / PDF</button></div></header><div class="content" id="content"></div><div class="footer">منصة لجان التوجيه الطلابي · إصدار محسّن للعرض والطباعة — البيانات محفوظة محليًا في المتصفح، ويُرجى الاحتفاظ بنسخة احتياطية.</div></main></div><div id="modal"></div><div id="toast" class="toast hidden"></div>
<script>

function home(){let total=Object.values(db.records).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0);return `<section class="hero"><div><h2>منصة لجان التوجيه الطلابي</h2><p>${esc(db.school)}<br>الموجّه الطلابي: ${esc(db.counselor)} · العام الدراسي ${esc(db.year)}<br>مكان موحد لمحاضر الاجتماعات والقرارات والتوصيات.</p></div><div class="seal"><b>7</b>لجان مدرسية</div></section><div class="stats"><div class="stat"><small>إجمالي المحاضر</small><strong>${total}</strong></div><div class="stat"><small>لجنة التوجيه الطلابي</small><strong>${rows("guidance").length}</strong></div><div class="stat"><small>لجنة التحصيل الدراسي</small><strong>${rows("achievement").length}</strong></div><div class="stat"><small>لجان السلوك والموهبة</small><strong>${rows("positive").length+rows("gifted").length}</strong></div></div><div class="panel"><div class="head"><div><h3>اللجان الرئيسية</h3><span class="muted">افتح اللجنة لإضافة محضر أو تعديل القرارات ومتابعة التنفيذ.</span></div><button class="btn" onclick="window.print()">طباعة الصفحة</button></div><div class="cards">${Object.entries(committees).map(([k,c])=>`<article class="committee"><div class="icon">${c.icon}</div><h3>${c.title}</h3><p>${c.desc}</p><div class="toolbar"><button class="btn primary" onclick="go('${k}')">فتح اللجنة</button><span class="tag">${rows(k).length} محضر</span></div></article>`).join("")}</div></div><div class="note">تنبيه: هذه منصة تنظيمية مساعدة، ويجب اعتماد مسميات اللجان وتشكيلها وإجراءاتها وفق التعاميم والأدلة السارية في المدرسة.</div>`}
function go(k){page=k;render();window.scrollTo(0,0)}
function committeePage(k){let c=committees[k],list=rows(k).filter(r=>JSON.stringify(r).toLowerCase().includes(query.toLowerCase()));return `<div class="panel"><div style="background:#edf7f6;border:1px solid #cce6e2;border-right:4px solid var(--teal);padding:13px 15px;border-radius:10px;margin-bottom:15px"><strong style="color:var(--navy);display:block;margin-bottom:4px">تعريف مختصر بدور اللجنة</strong><div style="font-size:13px;color:#40566a">${committeeRoles[k]||c.desc}</div></div><div class="head"><div><h3>${c.icon} ${c.title}</h3><span class="muted">${c.desc}</span></div><div class="toolbar no-print"><input id="search" class="search" placeholder="بحث في المحاضر..." value="${esc(query)}"><button class="btn primary" id="add">＋ محضر جديد</button><button class="btn" id="addMember">♙ إضافة عضو</button><button class="btn" onclick="window.print()">طباعة / PDF</button></div></div><div class="panel members-panel" style="margin-bottom:14px"><div class="head"><div><h3>قائمة أعضاء اللجنة</h3><span class="muted">أضف أعضاء اللجنة وعدّل بياناتهم أو احذفهم؛ لكل لجنة قائمة مستقلة.</span></div><span class="tag" id="memberCount">0 عضو</span></div><div class="tablewrap"><table><thead><tr><th>#</th><th>اسم العضو</th><th>الصفة / الدور</th><th>التخصص / جهة التمثيل</th><th>وسيلة التواصل</th><th class="no-print">الإجراءات</th></tr></thead><tbody id="membersRows"></tbody></table></div></div><div class="tablewrap"><table><thead><tr><th>#</th><th>عنوان الاجتماع</th><th>التاريخ</th><th>موضوعات مختصرة</th><th>التوصيات</th><th class="no-print">الإجراءات</th></tr></thead><tbody>${list.length?list.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.meeting)}</td><td>${esc(r.date)}</td><td>${esc((r.agenda||r.data||r.behavior||r.gifted||"").slice(0,110))}</td><td>${esc((r.recommendations||"").slice(0,110))}</td><td class="no-print"><div class="toolbar"><button class="btn small" onclick="edit('${k}','${r.id}')">تعديل</button><button class="btn small" onclick="view('${k}','${r.id}')">عرض</button><button class="btn small danger" onclick="del('${k}','${r.id}')">حذف</button></div></td></tr>`).join(""):`<tr><td colspan="6" class="empty">لا توجد محاضر مسجلة. اضغط «محضر جديد» للبدء.</td></tr>`}</tbody></table></div><p class="muted">عدد المحاضر: ${list.length}</p></div>`}
function settings(){return `<div class="panel"><div class="head"><h3>بيانات المدرسة</h3></div><form id="settingsForm"><div class="formgrid"><div class="field"><label>اسم المدرسة</label><input name="school" required value="${esc(db.school)}"></div><div class="field"><label>اسم الموجّه الطلابي</label><input name="counselor" value="${esc(db.counselor)}"></div><div class="field"><label>العام الدراسي</label><input name="year" value="${esc(db.year)}"></div></div><button class="btn primary">حفظ الإعدادات</button></form></div><div class="panel"><div class="head"><h3>النسخ الاحتياطي</h3></div><p class="muted">البيانات محفوظة في المتصفح الحالي. نزّل نسخة احتياطية بشكل دوري، واستعدها عند الانتقال إلى جهاز آخر.</p><div class="toolbar"><button class="btn primary" onclick="backup()">تنزيل نسخة JSON</button><label class="btn" for="restore">استعادة نسخة JSON</label><input id="restore" class="hidden" type="file" accept=".json,application/json"><button class="btn" onclick="window.print()">طباعة / PDF</button></div></div><div class="note"><strong>حماية السجلات:</strong> لا يحذف هذا التحديث أي محضر أو عضو أو توصية محفوظة. البيانات محلية على هذا المتصفح؛ نزّل نسخة JSON احتياطية قبل نقل المنصة أو تغيير الجهاز. لا تتضمن هذه النسخة تخزينًا سحابيًا أو حسابات مستخدمين.</div>`}
function renderMembers(k){let list=db.members[k]||[];let body=$("membersRows"),count=$("memberCount");if(count)count.textContent=list.length+" عضو";if(body)body.innerHTML=list.length?list.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.name)}</td><td>${esc(m.role||"—")}</td><td>${esc(m.area||"—")}</td><td>${esc(m.contact||"—")}</td><td class="no-print"><div class="toolbar"><button class="btn small" onclick="memberForm('${k}','${m.id}')">تعديل</button><button class="btn small danger" onclick="deleteMember('${k}','${m.id}')">حذف</button></div></td></tr>`).join(""):`<tr><td colspan="6" class="empty">لا يوجد أعضاء مسجلون لهذه اللجنة. أضف الأعضاء من الزر أعلاه.</td></tr>`}
function memberForm(k,id=null){let old=id?(db.members[k]||[]).find(x=>x.id===id)||{}:{};$("modal").innerHTML=`<div class="modalbg" id="memberBack"><div class="modal"><h3>${id?"تعديل بيانات عضو":"إضافة عضو"} — ${committees[k].title}</h3><form id="memberEntry"><div class="formgrid"><div class="field"><label>اسم العضو *</label><input name="name" required value="${esc(old.name||"")}"></div><div class="field"><label>المسمى الوظيفي *</label><select name="role" id="memberRole" required><option value="">اختر المسمى الوظيفي</option>${["مدير المدرسة","الوكيل","الموجه الطلابي","الموجه الصحي","المعلم","الطالب"].map(v=>`<option value="${v}" ${old.role===v?"selected":""}>${v}</option>`).join("")}</select></div><div class="field"><label>التخصص / جهة التمثيل</label><input name="area" value="${esc(old.area||"")}"></div><div class="field"><label>وسيلة التواصل (اختياري)</label><input name="contact" value="${esc(old.contact||"")}"></div></div><div class="modalfoot"><button class="btn primary">حفظ العضو</button><button type="button" class="btn" id="cancelMember">إلغاء</button></div></form></div></div>`;$("cancelMember").onclick=closeModal;$("memberBack").onclick=e=>{if(e.target.id==="memberBack")close()};$("memberEntry").onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));db.members[k]=db.members[k]||[];if(id){let i=db.members[k].findIndex(x=>x.id===id);if(i>=0)db.members[k][i]={...db.members[k][i],...data}}else db.members[k].push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...data});closeModal();localStorage.setItem("schoolCommitteesDB",JSON.stringify(db));render();toast("تم حفظ بيانات العضو")}}
function deleteMember(k,id){if(!confirm("هل تريد حذف هذا العضو من قائمة اللجنة؟"))return;db.members[k]=(db.members[k]||[]).filter(m=>m.id!==id);localStorage.setItem("schoolCommitteesDB",JSON.stringify(db));render();toast("تم حذف العضو")}
function wire(){if(committees[page]){renderMembers(page);let am=$("addMember");if(am)am.onclick=()=>memberForm(page)}let a=$("add");if(a)a.onclick=()=>form(page);let s=$("search");if(s)s.oninput=()=>{query=s.value;let p=s.selectionStart;render();$("search")?.focus();$("search")?.setSelectionRange(p,p)};let f=$("settingsForm");if(f)f.onsubmit=e=>{e.preventDefault();Object.assign(db,Object.fromEntries(new FormData(f)));save()};let r=$("restore");if(r)r.onchange=restore}
function hijriDate(value){if(!value)return "";const d=new Date(value+"T12:00:00");if(Number.isNaN(d.getTime()))return "";try{return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(d)}catch(e){return new Intl.DateTimeFormat("ar-SA-u-ca-islamic",{year:"numeric",month:"long",day:"numeric"}).format(d)}}
function printMembers(k){let list=db.members&&db.members[k]?db.members[k]:[];return `<section class="print-members"><h4>أعضاء اللجنة</h4>${list.length?`<table><thead><tr><th>م</th><th>اسم العضو</th><th>الصفة / الدور</th><th>التوقيع</th></tr></thead><tbody>${list.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.name||"—")}</td><td>${esc(m.role||"—")}</td><td class="sign-cell"></td></tr>`).join("")}</tbody></table>`:`<p class="print-no-members">لا توجد أسماء أعضاء مسجلة لهذه اللجنة.</p>`}<div class="print-approvals"><div class="approval-box"><strong>مدير المدرسة</strong><b>خميس عبدالله الكويكبي</b><span>التوقيع: ........................................</span></div><div class="approval-box"><strong>الموجه الطلابي</strong><b>عبدالله عبدالرحمن الشمري</b><span>التوقيع: ........................................</span></div></div></section>`}
function form(k,id=null){let c=committees[k],old=id?rows(k).find(x=>x.id===id)||{}:{};let fields=c.fields.map(f=>`<div class="field ${f[2]==="textarea"?"wide":""}"><label>${f[1]}${f[3]?" *":""}</label>${f[0]==="evidence"?`<textarea name="evidence" placeholder="اكتب وصف الشواهد أو المرفقات">${esc(old.evidence||"")}</textarea><label style="margin-top:8px">إرفاق ملفات الشواهد</label><input type="file" name="evidenceUpload" id="evidenceUpload" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.webp,.txt"><small class="muted">يمكن إرفاق PDF وWord وExcel وPowerPoint والصور والملفات النصية. حدّ أقصى 1 ميغابايت لكل ملف حفاظًا على مساحة التخزين.</small>${old.evidenceFiles&&old.evidenceFiles.length?`<div class="saved-attachments"><strong>المرفقات المحفوظة:</strong>${old.evidenceFiles.map((a,i)=>`<div><a href="${a.data||'#'}" download="${esc(a.name)}" target="_blank">${esc(a.name)}</a> <label class="inline-check"><input type="checkbox" name="removeEvidence" value="${i}"> حذف</label></div>`).join("")}</div>`:""}`:f[2]==="textarea"?`<textarea name="${f[0]}" ${f[3]?"required":""}>${esc(old[f[0]]||"")}</textarea>`:f[0]==="date"?`<input name="date" id="meetingDate" type="date" dir="rtl" value="${esc(old.date||"")}" ${f[3]?"required":""}><label for="hijriMeetingDate" style="margin-top:8px">التاريخ الهجري</label><input name="hijriDate" id="hijriMeetingDate" type="text" dir="rtl" placeholder="يظهر التاريخ الهجري هنا" value="${esc(old.hijriDate||hijriDate(old.date||""))}" readonly><small class="muted">اختر التاريخ من التقويم بالطريقة نفسها المستخدمة في حقول تاريخ الميلاد، وسيظهر مقابله التاريخ الهجري تلقائيًا.</small>`:`<input name="${f[0]}" type="${f[2]}" value="${esc(old[f[0]]||"")}" ${f[3]?"required":""}>`}</div>`).join("");$("modal").innerHTML=`<div class="modalbg" id="back"><div class="modal"><div class="print-header"><div class="ministry">المملكة العربية السعودية<br>وزارة التعليم<br>الإدارة العامة للتعليم بمنطقة الجوف<br>مجمع عدي بن حاتم الطائي بعذفاء</div><div class="doc-title">محضر اجتماع لجنة التوجيه الطلابي</div><div class="meta"><span>العام الدراسي: ${esc(db.year||"")}</span></div></div><h3>${id?"تعديل محضر":"محضر اجتماع جديد"} — ${c.title}</h3><form id="entry"><div class="formgrid">${fields}</div><div class="modalfoot"><button class="btn primary">حفظ المحضر</button><button class="btn" type="button" id="cancel">إلغاء</button></div></form>${printMembers(k)}</div></div>`;const md=$("meetingDate"),hd=$("hijriMeetingDate");if(md&&hd){hd.value=hd.value||hijriDate(md.value)||"";md.addEventListener("change",()=>{hd.value=hijriDate(md.value)||""})}$("cancel").onclick=closeModal;$("back").onclick=e=>{if(e.target.id==="back")close()};$("entry").onsubmit=async e=>{e.preventDefault();let formEl=e.target,fd=new FormData(formEl),data=Object.fromEntries(fd),arr=rows(k),existing=id?arr.find(x=>x.id===id)||{}:{},kept=(existing.evidenceFiles||[]).filter((a,i)=>!Array.from(formEl.querySelectorAll('input[name="removeEvidence"]:checked')).some(x=>Number(x.value)===i)),files=Array.from(($("evidenceUpload")||{}).files||[]);if(files.some(f=>f.size>1024*1024)){alert("حجم كل ملف يجب ألا يتجاوز 1 ميغابايت. قلّل حجم الملف ثم أعد إرفاقه.");return}let added=[];try{for(const f of files){const dataUrl=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)});added.push({name:f.name,type:f.type||"application/octet-stream",size:f.size,data:dataUrl})}}catch(_){alert("تعذر قراءة أحد الملفات المرفقة.");return}data.evidenceFiles=[...kept,...added];delete data.evidenceUpload;delete data.removeEvidence;if(id){let i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]={...arr[i],...data,updated:new Date().toLocaleDateString("ar-SA")}}else arr.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...data,updated:new Date().toLocaleDateString("ar-SA")});db.records[k]=arr;try{localStorage.setItem("schoolCommitteesDB",JSON.stringify(db))}catch(_){alert("تعذر حفظ المرفقات بسبب امتلاء مساحة المتصفح. أرفق ملفات أصغر أو احذف بعض المرفقات.");return}closeModal();render();toast("تم حفظ المحضر والمرفقات")}}
function closeModal(){$("modal").innerHTML=""}window.closeModal=closeModal;function edit(k,id){form(k,id)}function del(k,id){if(!confirm("هل تريد حذف هذا المحضر؟"))return;db.records[k]=rows(k).filter(x=>x.id!==id);save()}
function view(k,id){let c=committees[k],r=rows(k).find(x=>x.id===id);if(!r)return;$("modal").innerHTML=`<div class="modalbg" id="viewbg"><div class="modal"><div class="print-header"><div class="ministry">المملكة العربية السعودية<br>وزارة التعليم<br>الإدارة العامة للتعليم بمنطقة الجوف<br>مجمع عدي بن حاتم الطائي بعذفاء</div><div class="doc-title">محضر اجتماع لجنة التوجيه الطلابي</div><div class="meta"><span>العام الدراسي: ${esc(db.year||"")}</span></div></div><h3>${c.title} — ${esc(r.meeting)}</h3><div class="formgrid">${c.fields.map(f=>`<div class="field ${f[2]==="textarea"?"wide":""}"><label>${f[1]}</label><div style="white-space:pre-wrap;background:#f4f7fa;padding:10px;border-radius:8px;font-size:13px">${f[0]==="evidence"?`${esc(r.evidence||"—")}${r.evidenceFiles&&r.evidenceFiles.length?`<div class="saved-attachments"><strong>الملفات المرفقة:</strong>${r.evidenceFiles.map(a=>`<div><a href="${a.data||'#'}" download="${esc(a.name)}" target="_blank">${esc(a.name)}</a></div>`).join("")}</div>`:""}`:esc(r[f[0]]||"—")}</div></div>`).join("")}</div>${printMembers(k)}<div class="modalfoot"><button class="btn primary" onclick="edit('${k}','${id}')">تعديل</button><button class="btn" onclick="closeModal()">إغلاق</button><button class="btn" onclick="window.print()">طباعة</button></div></div></div>`;$("viewbg").onclick=e=>{if(e.target.id==="viewbg")close()}}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:"application/json;charset=utf-8"});download(b,"نسخة-احتياطية-اللجان.json")}
function download(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.records)throw 0;if(confirm("ستستبدل النسخة المستعادة البيانات الحالية. متابعة؟")){db=x;db.members=db.members||{};save()}}catch(_){alert("الملف غير صالح أو ليس نسخة احتياطية من المنصة.")}e.target.value=""};rd.readAsText(f)}
window.addEventListener("beforeprint",()=>{document.body.classList.toggle("printing-meeting",!!document.querySelector("#modal .modal"));});
window.addEventListener("afterprint",()=>document.body.classList.remove("printing-meeting"));
render();
</script></body></html>
